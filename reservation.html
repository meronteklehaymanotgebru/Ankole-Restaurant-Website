    <div class="reservation-page">
        <div class="karibu-reservation">
            <div id="logo-ankole" > <a href="index.html"></a><img src="images/65c0b0524cdc940f7455af22_logo.svg"></a></div>
            <h1>Karibu</h1>
            <h1 id="page-title">Reservation</h1>
        </div>
      <div class="reservation-form">
          <form id="reservation-fill-form">
            <label for="name">Name</label><br>
            <input type="text" id="name" placeholder="Enter your first name" required autofocus><br>
            <label for="location">Location</label><br>
            <select id="location">
                <option value="Kitisuru (Open 9 am- Closes 11 pm)">Kitisuru (Open 9 am- Closes 11 pm)</option>
                    <option value="Kilimani (Hours: Open 7:30- am Closes 11 pm)">Kilimani (Hours: Open 7:30- am Closes 11 pm)</option>
                    </select><br>
            <label for="email">Email Address</label><br>
            <input type="email" id="email" placeholder="e.ginfo@gmail.com" required><br>
            <label for="cellphone">Tell/Cell</label><br>
            <input type="tel" id="cellphone" placeholder="e.g 0700 000 000" maxlength="19" required><br>
            <label for="guests">Number of Guests</label><br>
            <input type="number" id="guests" min="1" max="8" placeholder="(maximum of 8 guests only)" required><br>
            <label for="date">Date</label><br>
            <input type="date" id="date"  required><br>
            <label for="time">Time</label><br>
            <input type="time" id="time"  required><br>
            <button type="submit">Submit</button>
    
          </form>
      </div>
    </div>
    <script>
      document.getElementById('reservation-fill-form').addEventListener("submit",function(e){
        e.preventDefault();
        alert("Reservation submitted successfully!");
        window.location.href="index.html";

      });
    </script>
